[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-aware-evidence-acquisition"
version = "0.0.1"
description = "Training-free, reward-guided audio-aware evidence acquisition over a frozen speech/omni core (API-only)."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
