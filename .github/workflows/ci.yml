name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Build distributions
        run: uv run python -m build
        env:
          UV_NO_SYNC: "1"

      - name: Run tests (fails on zero collected tests)
        run: uv run pytest -q

  contracts:
    # R0 semantics (not pre-R0): the package is installed first, then the
    # real current behavior of the two entrypoints is asserted -- not the
    # historical "both refuse with exit 2" behavior, which the scripts no
    # longer have. reproduce.sh/evaluate.sh --help are model-free and exit
    # 0; evaluate.sh with no args refuses with exit 2 (reproduce.sh with no
    # args instead fails closed with exit 1 on a missing SPEECHRL_DATA_DIR,
    # which is a distinct, already-covered contract -- see
    # tests/contract/test_scripts_fail_closed.py -- and is intentionally
    # not asserted here). Finally, the model-free contract-test subset that
    # needs no private assets and no model touch is run for real.
    #
    # R0 operator-path repair (independent rereview finding B1): the checks
    # above never dispatched past a bash branch into Python at all (--help/
    # no-args both exit inside the shell script first) -- they proved the
    # WRAPPER SCRIPT'S contract, not that the installed package's own
    # `python -m ...core.driver` / `saea-driver` entry points actually
    # execute. The two steps below close exactly that gap by invoking the
    # real, installed entry points directly, the same way an operator would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: python -m ...core.driver --help dispatches (real module entry point)
        run: |
          out="$(uv run python -m speech_aware_evidence_acquisition.core.driver --help)"
          echo "$out"
          echo "$out" | grep -qi "saea-driver"
          ! echo "$out" | grep -qi "cannot be directly executed"

      - name: saea-driver --help dispatches (real console-script entry point)
        run: |
          out="$(uv run saea-driver --help)"
          echo "$out"
          echo "$out" | grep -qi "saea-driver"

      - name: reproduce.sh --help is model-free and exits 0
        run: |
          out="$(uv run bash scripts/reproduce.sh --help)"
          echo "$out"
          echo "$out" | grep -qi "model-free"

      - name: evaluate.sh --help is model-free and exits 0
        run: |
          out="$(uv run bash scripts/evaluate.sh --help)"
          echo "$out"
          echo "$out" | grep -qi "model-free"

      - name: evaluate.sh with no args refuses with exit 2
        run: |
          set +e
          uv run bash scripts/evaluate.sh
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Model-free contract tests (no private assets, no model touch)
        run: uv run pytest tests/contract -q

      - name: Model-free smoke-orchestrator tests (--dry-run only, no model touch)
        run: uv run pytest tests/unit/test_driver_smoke.py -q

  lint:
    # Scoped to package source (src/), not tests/: tests/ carries findings
    # from concurrently in-flight repair tasks not owned by this gate (see
    # docs/engineering.md, R0 repair T9). The quarantined W1 snapshot under
    # reference/w1-snapshot/ is excluded repo-wide in pyproject.toml and
    # must never be reformatted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: ruff check (active source tree)
        run: uv run ruff check src
