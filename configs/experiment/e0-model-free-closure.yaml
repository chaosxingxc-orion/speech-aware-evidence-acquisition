# E0: model-free data closure. No frozen-core call is authorized while this stage is open.
experiment_namespace: SAEA-E
domain: speech-only
stage: E0
model_touch: false
excluded_lock_keys:
  - fsd50k
  - audioset-metadata-features
  - esc-50
deliverables:
  d1_identity: OPEN     # carrier/lock identity alignment receipts
  d2_leakage: OPEN      # leakage negative controls
  d3_scoring: OPEN      # scoring stack freeze
  d4_trace: OPEN        # ten-sample end-to-end trace (model-free)
gate:
  # consumed by contracts.FrozenCoreGate -- receipts are verified, not trusted:
  # schemas saea-e0-closure-receipt-v1 / saea-runtime-receipt-v1; D1-D4 bind artifact
  # hashes; model files re-hashed from data_root against the frozen lock entry
  # (key/subdir/count/total bytes); build commit backed by the on-disk binary.
  e0_receipt: docs/receipts/e0-closure.json
  runtime_receipt: docs/receipts/runtime.json
  data_root: SPEECHRL_DATA_DIR                     # controlled asset root (env)
  lock: ../../docs/datasets.lock.json              # umbrella lock (adjacent-checkout layout)
  runtime_root: WSL ext4 llama.cpp build root      # resolved per machine at receipt time
